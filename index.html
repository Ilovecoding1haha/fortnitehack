<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VaultPay Rewards — Get a $100 gift card for $1/month</title>
<style>
#vp{--bg:#0b0d16;--card:#12141f;--card2:#171a28;--line:#242b45;--fg:#e9ecff;--dim:#8891b5;--green:#39ff9e;--purple:#a678ff;--cyan:#49dcff;--yellow:#ffd93d;--red:#ff4d6d;--blue:#5b6cff;
font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,sans-serif;background:var(--bg);color:var(--fg);min-height:100vh;font-size:14px;line-height:1.5}
#vp *{box-sizing:border-box;margin:0;padding:0}
#vp .page{max-width:700px;margin:0 auto;border-left:1px solid var(--line);border-right:1px solid var(--line);min-height:100vh}
#vp a{color:var(--dim);text-decoration:none}
#vp .mono{font-family:ui-monospace,Menlo,Consolas,monospace}
#vp .tick{background:var(--card2);border-bottom:1px solid var(--line);overflow:hidden;height:30px;display:flex;align-items:center}
#vp .tick .in{display:inline-block;white-space:nowrap;animation:mq 26s linear infinite;font-size:11px;color:var(--dim);padding-left:100%}
#vp .tick b{color:var(--green)}
@keyframes mq{0%{transform:translateX(0)}100%{transform:translateX(-100%)}}
#vp nav{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line)}
#vp .logo{font-weight:600;font-size:15px;letter-spacing:-.2px}
#vp .logo span{color:var(--purple)}
#vp .navlinks{display:flex;gap:14px;font-size:11px}
#vp .wrap{padding:22px 18px}
#vp .hero{text-align:center;padding:6px 0 18px}
#vp .pill{display:inline-block;font-size:10px;padding:3px 10px;border-radius:20px;border:1px solid var(--green);color:var(--green);margin-bottom:12px}
#vp h1{font-size:26px;line-height:1.25;font-weight:600;letter-spacing:-.5px}
#vp h1 em{font-style:normal;color:var(--green)}
#vp .lead{color:var(--dim);font-size:13px;margin-top:10px}
#vp .trust{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:14px}
#vp .tb{font-size:9.5px;padding:3px 8px;border-radius:20px;border:1px solid var(--line);color:var(--dim)}
#vp .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
#vp .plan{border-color:var(--purple);position:relative}
#vp .ribbon{position:absolute;top:-10px;left:16px;background:var(--purple);color:#fff;font-size:9.5px;font-weight:600;padding:3px 9px;border-radius:20px;letter-spacing:.4px}
#vp .plan .amt{display:flex;align-items:baseline;gap:8px}
#vp .plan .big{font-size:40px;font-weight:600;letter-spacing:-1.5px}
#vp .plan .per{color:var(--dim);font-size:12px}
#vp .plan .strike{color:var(--dim);text-decoration:line-through;font-size:13px}
#vp .plan ul{list-style:none;margin:14px 0;display:grid;gap:7px}
#vp .plan li{font-size:12.5px;color:var(--dim);display:flex;gap:8px;align-items:flex-start}
#vp .plan li b{color:var(--fg);font-weight:500}
#vp .chk{color:var(--green);flex:0 0 auto}
#vp .pick{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
#vp .opt{border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center;font-size:11.5px;cursor:pointer;color:var(--dim);background:var(--card2)}
#vp .opt.on{border-color:var(--green);color:var(--fg)}
#vp .opt b{display:block;font-size:12.5px;color:var(--fg);font-weight:500}
#vp .cta{display:block;width:100%;text-align:center;background:var(--green);color:#04120a;border:0;border-radius:10px;padding:13px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit}
#vp .cta:hover{filter:brightness(1.08)}
#vp .sub{font-size:10.5px;color:var(--dim);text-align:center;margin-top:8px}
#vp .lbl{display:block;font-size:10.5px;color:var(--dim);margin-bottom:5px;letter-spacing:.2px}
#vp input[type=text],#vp input[type=email],#vp select{width:100%;background:#0d1020;color:var(--fg);border:1px solid var(--line);border-radius:9px;padding:10px 11px;font-family:inherit;font-size:13px;outline:none}
#vp input:focus{border-color:var(--purple);box-shadow:0 0 0 3px rgba(166,120,255,.13)}
#vp .row{margin-bottom:11px}
#vp .g3{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px}
#vp .g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#vp .trap{position:absolute;top:0;left:0;width:1px;height:1px;overflow:hidden;opacity:.02;pointer-events:none}
#vp .spon{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center}
#vp .spon span{font-size:11px;color:var(--dim);border:1px solid var(--line);border-radius:6px;padding:5px 10px;letter-spacing:.3px}
#vp .sec{font-size:11px;letter-spacing:1.4px;color:var(--dim);text-align:center;margin-bottom:12px;text-transform:uppercase}
#vp .rev{border-left:2px solid var(--line);padding-left:11px;margin-bottom:12px}
#vp .rev p{font-size:12.5px}
#vp .rev .who{font-size:10.5px;color:var(--dim);margin-top:5px}
#vp footer{border-top:1px solid var(--line);padding:18px;font-size:10.5px;color:var(--dim);background:var(--card2)}
#vp footer .cols{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
#vp footer .cols div{display:grid;gap:5px}
#vp footer .disc{font-size:9.5px;line-height:1.6;opacity:.75;margin-top:10px;border-top:1px solid var(--line);padding-top:10px}
#vp .console{background:#07080f;border-top:1px solid var(--line);padding:16px 18px}
#vp .chd{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
#vp .chd h3{font-size:12px;font-weight:600;letter-spacing:.5px}
#vp .chd h3 span{color:var(--green)}
#vp .stat{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--dim);margin-bottom:12px}
#vp .dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green)}
#vp .flex{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
#vp .flex>*{flex:1 1 auto}
#vp .flex select{flex:2 1 160px}
#vp .sw{display:flex;align-items:center;gap:6px;font-size:10.5px;color:var(--dim);flex:0 0 auto;cursor:pointer}
#vp .sw input{width:auto}
#vp .btn{background:var(--card2);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:9px 12px;font-family:inherit;font-size:11px;cursor:pointer;white-space:nowrap}
#vp .btn:hover{border-color:var(--purple)}
#vp .btn.g{border-color:var(--green);color:var(--green)}
#vp .ep{font-size:10px;color:var(--dim);word-break:break-all;margin-top:8px}
#vp .last{margin-top:12px;padding:11px;border:1px dashed var(--line);border-radius:10px}
#vp .last .n{font-size:17px;font-weight:600;letter-spacing:1.2px}
#vp .last .m{font-size:10.5px;color:var(--dim);margin-top:5px;display:flex;gap:9px;flex-wrap:wrap}
#vp .rec{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:12px;align-items:center}
#vp .rec:last-child{border-bottom:0}
#vp .rec .rn{letter-spacing:.6px;font-family:ui-monospace,monospace}
#vp .rec .rm{font-size:9.5px;color:var(--dim);margin-top:2px;font-family:ui-monospace,monospace}
#vp .tag{font-size:9px;padding:1px 6px;border-radius:20px;border:1px solid var(--line);color:var(--dim);font-family:ui-monospace,monospace}
#vp .tag.ok{color:var(--green);border-color:var(--green)}
#vp .tag.bad{color:var(--yellow);border-color:var(--yellow)}
#vp .empty{color:var(--dim);font-size:11px;padding:6px 0}
#vp details{font-size:11px;color:var(--dim);margin-top:10px}
#vp summary{cursor:pointer;font-size:10.5px;color:var(--cyan);letter-spacing:.3px}
#vp pre{font-family:ui-monospace,monospace;font-size:10px;color:var(--dim);white-space:pre-wrap;word-break:break-all;margin-top:8px;line-height:1.6;max-height:230px;overflow:auto}
#vp .toast{position:fixed;right:14px;top:14px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 11px;font-size:11px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:9}
#vp .toast.on{opacity:1}
#vp .flash{animation:fl .9s ease}
@keyframes fl{0%{border-color:var(--green)}100%{border-color:var(--line)}}
#vp input:-webkit-autofill{animation-name:vpFill;animation-duration:1ms}
@keyframes vpFill{from{outline-color:#000}to{outline-color:#fff}}
</style>
</head>
